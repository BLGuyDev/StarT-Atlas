name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Page bodies and guia/data/wiki-data.js must match the front matter in docs/ (no packages needed)
      - run: |
          node tools/refresh_body.js
          git diff --exit-code -- docs || { echo "Run node tools/refresh_body.js and commit"; exit 1; }
          node tools/build_data.js --check
      - run: pip install -r requirements.txt
      # mkdocs.yml at the repo root (docs_dir: docs); the nav is built by hooks/atlas_docs.py
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
