# Star Technology Atlas - Markdown wiki (MkDocs Material). Build: pip install -r requirements.txt && mkdocs build --strict
# The navigation is generated by hooks/atlas_docs.py from the pages in docs/ (no hand-written list).
# To pin a custom nav, add a `nav:` key here; the hook then does nothing.
site_name: Star Technology Atlas
site_description: Unofficial progression guide for the Star Technology modpack (GregTech CEu fork "StarT").
site_url: https://blguydev.github.io/StarT-Atlas/
repo_url: https://github.com/BLGuyDev/StarT-Atlas
repo_name: BLGuyDev/StarT-Atlas
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Unofficial fan project, not affiliated with the StarT Dev Team. See NOTICE.md.

theme:
  name: material
  language: en
  palette:
    # first entry is the default: dark, with a toggle to light
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # no navigation.tabs: one sidebar with sections
    - navigation.sections
    - navigation.prune
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

hooks:
  - hooks/atlas_docs.py

extra_css:
  - stylesheets/panels.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details

exclude_docs: |
  _data/
  assets/icons/.gitkeep

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
